
name: Extract Website ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract website files
        run: |
          unzip -o ARCHON-TECH-WEBSITE-v1.3.0-PUBLISH.zip -d extracted
          cp -a extracted/. .
          rm -rf extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract website deployment files" || echo "No changes to commit"
          git push
